        text: null
add_tire_record:
  fields:
    entry_id: *id001
    vehicle_id: *id002
    position:
      required: true
      selector:
        select:
          options:
          - Front Left
          - Front Right
          - Rear Left
          - Rear Right
    brand:
      required: false
      selector:
        text: null
    model:
      required: false
      selector:
        text: null
    size:
      required: false
      selector:
        text: null
    installation_date:
      required: false
      selector:
        date: null
    installation_mileage:
      required: false
      selector:
        number:
          min: 0
          max: 2000000
          mode: box
    current_tread_depth:
      required: false
      selector:
        number:
          min: 0
          max: 20
          step: 0.5
          mode: box
    original_tread_depth:
      required: false
      selector:
        number:
          min: 0
          max: 20
          step: 0.5
          mode: box
    dot_date:
      required: false
      selector:
        text: null
    purchase_cost:
      required: false
      selector:
        number:
          min: 0
          max: 10000
          step: 0.01
          mode: box
    replacement_cost:
      required: false
      selector:
        number:
          min: 0
          max: 10000
          step: 0.01
          mode: box
    notes:
      required: false
      selector:
        text:
          multiline: true
add_brake_record:
  fields:
    entry_id: *id001
    vehicle_id: *id002
    axle:
      required: true
      selector:
        select:
          options:
          - Front
          - Rear
    condition:
      required: false
      default: Good
      selector:
        select:
          options:
          - Good
          - Fair
          - Needs Service
          - Replace
    pad_thickness:
      required: false
      selector:
        number:
          min: 0
          max: 30
          step: 0.1
          mode: box
    rotor_condition:
      required: false
      selector:
        text: null
    inspection_date:
      required: false
      selector:
        date: null
    inspection_mileage:
      required: false
      selector:
        number:
          min: 0
          max: 2000000
          mode: box
    notes:
      required: false
      selector:
        text:
          multiline: true
set_mileage:
  fields:
    entry_id: *id001
    vehicle_id: *id002
    mileage:
      required: true
      selector:
        number:
          min: 0
          max: 2000000
          mode: box
search_service_records:
  fields:
    entry_id: *id001
    vehicle_id: *id002
    query:
      required: false
      example: alignment
      selector:
        text: null
    year:
      required: false
      selector:
        number:
          min: 1990
          max: 2100
          mode: box
    category:
      required: false
      selector:
        text: null
    service_provider:
      required: false
      selector:
        text: null
    name:
      required: false
      selector:
        text: null
    min_cost:
      required: false
      selector:
        number:
          min: 0
          max: 100000
          step: 0.01
          mode: box
    max_cost:
      required: false
      selector:
        number:
          min: 0
          max: 100000
          step: 0.01
          mode: box
    sort:
      required: false
      default: newest
      selector:
        select:
          options:
          - newest
          - oldest
          - highest_cost
          - lowest_cost
          - highest_mileage
          - lowest_mileage
    limit:
      required: false
      default: 50
      selector:
        number:
          min: 1
          max: 500
          mode: box
export_data:
  fields:
    entry_id: *id001
    vehicle_id: *id002
    format:
      required: false
      default: json
      selector:
        select:
          options:
          - json
          - csv
    all_vehicles:
      required: false
      default: false
      selector:
        boolean: null
import_data:
  fields:
    entry_id: *id001
    vehicle_id: *id002
    file_path:
      required: true
      example: /config/tesla_maintenance/exports/tesla_maintenance_20260820_101500.json
      selector:
        text: null
    mode:
      required: false
      default: merge
      selector:
        select:
          options:
          - merge
          - skip_duplicates
backup_database:
  fields:
    entry_id: *id001
    vehicle_id: *id002

add_service_record:
  fields:
    entry_id: &id001
      required: false
      example: 01J000000000000000000000
      selector:
        text: null
    vehicle_id: &id002
      required: false
      example: 1
      selector:
        number:
          min: 1
          max: 9999
          mode: box
    service_date:
      required: false
      example: '2026-08-20'
      selector:
        date: null
    mileage:
      required: false
      example: 42580
      selector:
        number:
          min: 0
          max: 2000000
          mode: box
    title:
      required: false
      example: Annual service
      selector:
        text: null
    description:
      required: false
      selector:
        text:
          multiline: true
    service_provider:
      required: false
      example: Tesla Service Center
      selector:
        text: null
    location:
      required: false
      selector:
        text: null
    labor_cost:
      required: false
      selector:
        number:
          min: 0
          max: 100000
          step: 0.01
          mode: box
    parts_cost:
      required: false
      selector:
        number:
          min: 0
          max: 100000
          step: 0.01
          mode: box
    total_cost:
      required: false
      selector:
        number:
          min: 0
          max: 100000
          step: 0.01
          mode: box
    notes:
      required: false
      example: Technician recommended checking alignment.
      selector:
        text:
          multiline: true
    items:
      required: false
      example: '[{"name": "Tire Rotation", "category": "Tires", "cost": 65}]'
      selector:
        object: null

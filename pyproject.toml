[project]
name = "tesla-maintenance"
version = "1.0.0"
description = "Tesla Maintenance Tracker - a Home Assistant custom integration for vehicle maintenance records"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

[tool.ruff]
target-version = "py312"
line-length = 90
src = ["custom_components", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # bugbear
    "SIM",  # simplify
    "D",    # pydocstyle
    "ASYNC",
    "T20",  # no print statements
    "RUF",
]
ignore = [
    "D203",  # conflicts with D211
    "D213",  # conflicts with D212
    "E501",  # long lines are handled by the formatter
]

[tool.ruff.lint.per-file-ignores]
# sqlite3.Row requires .keys(); tests may use assert-heavy style.
"custom_components/tesla_maintenance/database/models.py" = ["SIM118"]
"tests/*" = ["D100", "D101", "D102", "D103", "D104"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

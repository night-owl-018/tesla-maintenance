# Gitea Actions - lint and tests only.
#
# Hassfest and the HACS action are GitHub-hosted actions and are not mirrored
# to Gitea, so they are intentionally omitted here. Run them on a GitHub mirror
# if you need them, or locally as described in docs/troubleshooting.md.
#
# Requires a Gitea instance with Actions enabled and a runner that provides a
# `ubuntu-latest` label.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_test.txt
      - name: Lint
        run: ruff check custom_components tests
      - name: Run tests
        run: pytest tests -q
